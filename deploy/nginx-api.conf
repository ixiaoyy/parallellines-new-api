# Additive vhost. Certificates must exist before nginx -t/reload.
# Nginx must join the service's explicit edge network.
map $http_upgrade $pl_api_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name api.pingxingxian.space;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://api.pingxingxian.space$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name api.pingxingxian.space;
    ssl_certificate /etc/letsencrypt/live/api.pingxingxian.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pingxingxian.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pl_api_upstream parallellines-api:3000;
    client_max_body_size 50m;
    location / {
        proxy_pass http://$pl_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pl_api_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
