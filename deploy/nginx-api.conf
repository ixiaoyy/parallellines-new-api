# Additive vhost. Certificates must exist before nginx -t/reload.
# Nginx must join the service's explicit edge network.
map $http_upgrade $pl_api_connection {
    default upgrade;
    '' close;
}
# 仅成功返回的 Vite 指纹文件可被浏览器/CDN 长缓存；HTML、错误和个性接口均不存储。
# CDN 仍须遵守响应头，不得以全站 Cache Everything 覆盖鉴权与生成流的 no-store。
# URI 归一化后也可能落入 SPA；必须是上游明确声明的静态类型，HTML/JSON/未知类型不获缓存资格。
map $upstream_http_content_type $pl_api_static_content_type {
    default 0;
    "~*^(?:(?:application|text)/(?:javascript|x-javascript)|text/css|image/[a-z0-9.+-]+|font/[a-z0-9.+-]+|application/(?:octet-stream|font-woff|font-sfnt|vnd[.]ms-fontobject|x-font-(?:ttf|opentype|woff2?)))(?:;|$)" 1;
}
map "$status:$pl_api_static_content_type:$uri" $pl_api_cache_control {
    default "no-store";
    "~^200:1:/assets/[A-Za-z0-9_./-]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|ttf|png|jpe?g|webp|svg|ico)$" "public, max-age=31536000, immutable";
}
server {
    listen 80;
    server_name api.pingxingxian.space;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://api.pingxingxian.space$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name api.pingxingxian.space;
    ssl_certificate /etc/letsencrypt/live/api.pingxingxian.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pingxingxian.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pl_api_upstream parallellines-api:3000;
    client_max_body_size 50m;
    location / {
        proxy_pass http://$pl_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pl_api_connection;
        proxy_cookie_flags session secure;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $pl_api_cache_control always;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
